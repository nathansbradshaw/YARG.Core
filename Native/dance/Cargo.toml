[package]
name = "yarg-dance"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
yace-stepmania = { path = "vendor/yace-stepmania" }

[profile.release]
strip = true

